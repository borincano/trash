<style>
  #muzz-fullbleed{
    position:fixed !important;
    top:0 !important; left:0 !important; right:0 !important; bottom:0 !important;
    width:100vw !important;
    height:100vh !important;
    height:100dvh !important;
    max-width:none !important;
    margin:0 !important;
    padding:0 !important;
    border:0 !important;
    z-index:2147483646 !important;
    background:#04040c !important;
    overflow:hidden !important;
  }
  #muzz-fullbleed iframe{
    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    border:0 !important;
    display:block !important;
    background:#04040c !important;
  }
</style>
<div id="muzz-fullbleed">
  <iframe
    src="https://borincano.github.io/trash/docs/promo/?v=full1&embed=1"
    title="MUZZ GALAXY"
    loading="eager"
    allow="fullscreen"
    allowfullscreen
  ></iframe>
</div>
<script>
(function () {
  function bustGoDaddyBox() {
    var w = document.getElementById('muzz-fullbleed');
    if (!w) return;
    var h = window.innerHeight || document.documentElement.clientHeight || 800;
    w.style.height = h + 'px';
    var p = w.parentElement;
    for (var i = 0; i < 12 && p; i++) {
      try {
        p.style.setProperty('padding', '0', 'important');
        p.style.setProperty('margin', '0', 'important');
        p.style.setProperty('max-width', '100%', 'important');
        p.style.setProperty('width', '100%', 'important');
        p.style.setProperty('overflow', 'visible', 'important');
        p.style.setProperty('min-height', h + 'px', 'important');
        p.style.setProperty('height', 'auto', 'important');
        p.style.setProperty('background', '#04040c', 'important');
      } catch (e) {}
      p = p.parentElement;
    }
    try {
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
      document.body.style.margin = '0';
      document.body.style.padding = '0';
      document.body.style.background = '#04040c';
    } catch (e) {}
  }
  bustGoDaddyBox();
  window.addEventListener('resize', bustGoDaddyBox);
  window.addEventListener('load', bustGoDaddyBox);
  setInterval(bustGoDaddyBox, 800);
})();
</script>
